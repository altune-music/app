name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      VERSION: ${{ steps.set_version.outputs.VERSION }}
      BUILD_NUMBER: ${{ steps.set_version.outputs.BUILD_NUMBER }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-apk
            path: build/app/outputs/flutter-apk/altune-${{ github.ref_name }}.apk
            name: altune-${{ github.ref_name }}.apk
          - target: linux
            path: build/linux/x64/release/altune-${{ github.ref_name }}.AppImage
            name: altune-${{ github.ref_name }}.AppImage

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Decode keystore
        if: matrix.target == 'android-apk'
        run: |
          mkdir -p android/app
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          ls -l android/app/keystore.jks

      - name: Create key.properties
        if: matrix.target == 'android-apk'
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=altune
          storeFile=keystore.jks
          EOF

      - name: Set version
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}"
          echo "BUILD_NUMBER=${BUILD_NUMBER}"

      - name: Build ${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "android-apk" ]; then
            flutter build apk --release \
              --build-name ${VERSION#v} \
              --build-number ${{ env.BUILD_NUMBER }}
          else
            flutter build linux \
              --build-name ${VERSION#v} \
              --build-number ${{ env.BUILD_NUMBER }}
          fi

      - name: Rename Android APK
        if: matrix.target == 'android-apk'
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK not found"
            exit 1
          fi
          mv build/app/outputs/flutter-apk/app-release.apk ${{ matrix.path }}

      - name: Package AppImage
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 librsvg2-bin
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/0f3b5e5/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          APPDIR=build/linux/x64/release/bundle

          # Create desktop file in AppDir root
          cat > "$APPDIR/altune.desktop" <<EOF
          [Desktop Entry]
          Name=Altune
          Comment=Music Player
          Exec=altune
          Icon=altune
          Type=Application
          Categories=AudioVideo;Player;
          EOF

          # Convert SVG icon to PNG for AppImage
          rsvg-convert -o "$APPDIR/altune.png" assets/app_icon.svg

          # Ensure the executable is discoverable by linuxdeploy/appimagetool
          mkdir -p "$APPDIR/usr/bin"
          ln -sf ../../altune "$APPDIR/usr/bin/altune"

          # Verify files exist
          ls -la "$APPDIR/altune.desktop" "$APPDIR/altune.png" "$APPDIR/altune" "$APPDIR/usr/bin/altune"

          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/altune" \
            --desktop-file "$APPDIR/altune.desktop" \
            --icon-file "$APPDIR/altune.png" \
            --output appimage
          appimage=$(find . -maxdepth 1 -name '*.AppImage' -type f | head -n1)
          if [ -z "$appimage" ]; then
            echo "No AppImage produced"
            exit 1
          fi
          mv "$appimage" ${{ matrix.path }}

      - name: Generate checksums
        run: |
          if [ -f "${{ matrix.path }}" ]; then
            cd "$(dirname "${{ matrix.path }}")"
            sha256sum "$(basename "${{ matrix.path }}")" > "$(basename "${{ matrix.path }}").sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-checksum
          path: ${{ matrix.path }}.sha256

      - name: Cleanup signing files
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
