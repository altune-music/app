name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Set version
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: |
          mkdir -p android/app
          printf "%s" "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          ls -l android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=altune
          storeFile=keystore.jks
          EOF

      - name: Build APK
        run: flutter build apk --release --build-name ${{ steps.set_version.outputs.VERSION }} --build-number ${{ steps.set_version.outputs.BUILD_NUMBER }}
        env:
          VERSION: ${{ steps.set_version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.set_version.outputs.BUILD_NUMBER }}

      - name: Rename APK
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK not found"
            exit 1
          fi
          mv build/app/outputs/flutter-apk/app-release.apk altune-${{ steps.set_version.outputs.VERSION }}.apk

      - name: Generate checksum
        run: sha256sum altune-${{ steps.set_version.outputs.VERSION }}.apk > altune-${{ steps.set_version.outputs.VERSION }}.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: altune-${{ steps.set_version.outputs.VERSION }}
          path: |
            altune-${{ steps.set_version.outputs.VERSION }}.apk
            altune-${{ steps.set_version.outputs.VERSION }}.apk.sha256

      - name: Cleanup signing files
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties

  build-linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Cache pub
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev librsvg2-bin ruby-dev build-essential

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Set version
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        run: flutter build linux --release --build-name ${{ steps.set_version.outputs.VERSION }} --build-number ${{ steps.set_version.outputs.BUILD_NUMBER }}
        env:
          VERSION: ${{ steps.set_version.outputs.VERSION }}
          BUILD_NUMBER: ${{ steps.set_version.outputs.BUILD_NUMBER }}

      - name: Package tarball
        run: |
          tar czf altune-${{ steps.set_version.outputs.VERSION }}-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Package deb and rpm
        run: |
          VERSION=${{ github.run_number }}
          STAGING=package-staging

          mkdir -p ${STAGING}/opt/altune
          mkdir -p ${STAGING}/usr/bin
          mkdir -p ${STAGING}/usr/share/applications
          mkdir -p ${STAGING}/usr/share/icons/hicolor/128x128/apps

          cp -r build/linux/x64/release/bundle/* ${STAGING}/opt/altune/

          cat > ${STAGING}/usr/bin/altune <<'EOF'
          #!/bin/bash
          exec /opt/altune/altune "$@"
          EOF
          chmod +x ${STAGING}/usr/bin/altune

          cat > ${STAGING}/usr/share/applications/altune.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Altune
          Comment=Music Player
          Exec=altune
          Icon=altune
          Categories=AudioVideo;Player;
          EOF

          rsvg-convert -o ${STAGING}/usr/share/icons/hicolor/128x128/apps/altune.png \
            assets/app_icon.svg

          fpm -s dir -t deb -n altune -v ${VERSION} --architecture amd64 --depends libgtk-3-0 --depends libblkid1 --depends liblzma5 --description "Altune Music Player" --package altune-${{ steps.set_version.outputs.VERSION }}_amd64.deb -C ${STAGING} .

          fpm -s dir -t rpm -n altune -v ${VERSION} --architecture x86_64 --depends gtk3 --depends lzma --depends util-linux --description "Altune Music Player" --package altune-${{ steps.set_version.outputs.VERSION }}_x86_64.rpm -C ${STAGING} .

      - name: Generate checksums
        run: |
          sha256sum altune-* > checksums.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: altune-${{ steps.set_version.outputs.VERSION }}-linux
          path: |
            altune-${{ steps.set_version.outputs.VERSION }}-linux-x64.tar.gz
            altune-${{ steps.set_version.outputs.VERSION }}_amd64.deb
            altune-${{ steps.set_version.outputs.VERSION }}_x86_64.rpm
            checksums.txt

  release:
    name: Create GitHub Release
    needs: [build-android, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
